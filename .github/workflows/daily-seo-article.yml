name: Daily SEO article

on:
  schedule:
    # Use Toronto time directly so daylight-saving changes do not shift publication.
    # The second run is a backup and skips automatically when today's article exists.
    - cron: "7 9 * * *"
      timezone: "America/Toronto"
    - cron: "37 9 * * *"
      timezone: "America/Toronto"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily-seo-article.yml"
      - "scripts/seo-editorial-*.mjs"
      - "scripts/seo-topic-planner.mjs"
      - "scripts/generate-seo-article.mjs"
      - "scripts/verify-seo-live.mjs"
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional article topic override"
        required: false
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-seo-article
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    # 14-minute bounded generation + a bounded build + 5-minute live check.
    timeout-minutes: 30
    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh main before checking freshness
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Check whether today's article already exists
        # Node is configured first because the freshness check uses the same
        # parser for the working tree and the final remote snapshot.
        id: freshness
        run: |
          set -euo pipefail
          TODAY="$(TZ=America/Toronto date +%F)"
          echo "PUBLICATION_DATE=$TODAY" >> "$GITHUB_ENV"
          PUBLISHED="$(node scripts/check-seo-publication.mjs "$TODAY")"
          if [ "$PUBLISHED" = "true" ]; then
            echo "Article for $TODAY already exists; skipping this run."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "No article for $TODAY; publishing now."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check editorial capacity before generation
        if: steps.freshness.outputs.should_publish == 'true'
        run: node scripts/seo-editorial-health.mjs --require-capacity

      - name: Generate article with DeepSeek
        id: generation
        if: steps.freshness.outputs.should_publish == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-v4-flash
          ARTICLE_TOPIC: ${{ inputs.topic }}
        run: node scripts/generate-seo-article.mjs

      - name: Check whether a draft passed the quality gate
        if: steps.freshness.outputs.should_publish == 'true'
        id: quality_gate
        run: |
          if git diff --quiet -- app/insights/articles.ts; then
            echo "The generator completed without producing an article." >&2
            exit 1
          fi
          if [ "$(node scripts/check-seo-publication.mjs "$PUBLICATION_DATE")" != "true" ]; then
            echo "The draft does not publish an active article for $PUBLICATION_DATE." >&2
            exit 1
          fi
          echo "passed=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.quality_gate.outputs.passed == 'true'
        run: npm ci

      - name: Verify production build
        if: steps.quality_gate.outputs.passed == 'true'
        run: npm run build

      - name: Recheck today's article before commit
        id: final_freshness
        if: steps.quality_gate.outputs.passed == 'true'
        run: |
          set -euo pipefail
          TODAY="$PUBLICATION_DATE"
          git fetch origin main
          PUBLISHED="$(git show origin/main:app/insights/articles.ts | node scripts/check-seo-publication.mjs "$TODAY" -)"
          if [ "$PUBLISHED" = "true" ]; then
            echo "Another run already published the article for $TODAY; discarding this duplicate."
            git restore --source=origin/main -- app/insights/articles.ts
            echo "should_commit=false" >> "$GITHUB_OUTPUT"
          else
            echo "The article for $TODAY is still unpublished; continuing."
            echo "should_commit=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit article
        if: steps.quality_gate.outputs.passed == 'true' && steps.final_freshness.outputs.should_commit == 'true'
        run: |
          git config user.name "runex-seo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/insights/articles.ts
          if git diff --cached --quiet; then
            echo "The validated draft disappeared before commit." >&2
            exit 1
          fi
          git commit -m "Publish daily logistics insight"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify the committed article is live
        # Also checks the existing article when primary/backup/manual runs skip.
        # A repository commit is not proof that its deployment has succeeded.
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:app/insights/articles.ts > "$RUNNER_TEMP/published-articles.ts"
          ARTICLES_PATH="$RUNNER_TEMP/published-articles.ts" node scripts/verify-seo-live.mjs "$PUBLICATION_DATE"

      - name: Maintain the editorial replenishment alert
        if: always() && !cancelled()
        # An issue API outage must not prevent or undo a valid publication.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:app/insights/articles.ts > "$RUNNER_TEMP/editorial-archive.ts"
          ARTICLES_PATH="$RUNNER_TEMP/editorial-archive.ts" node scripts/seo-editorial-health.mjs --notify
