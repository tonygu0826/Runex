name: Daily SEO article

on:
  schedule:
    # These best-effort triggers maintain a two-day deployed reserve.
    # The website itself releases each prepared article at 09:00 Toronto time.
    # The backup skips generation only when today's and both reserve days exist.
    - cron: "7 9 * * *"
      timezone: "America/Toronto"
    - cron: "37 9 * * *"
      timezone: "America/Toronto"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily-seo-article.yml"
      - "scripts/seo-editorial-*.mjs"
      - "scripts/seo-topic-planner.mjs"
      - "scripts/generate-seo-article.mjs"
      - "scripts/verify-seo-live.mjs"
      - "scripts/seo-publication-queue.mjs"
      - "app/insights/publication-time.mjs"
      - "app/insights/publications.ts"
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional article topic override"
        required: false
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-seo-article
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    # At most two 14-minute generation budgets + build + a shared 5-minute live check.
    timeout-minutes: 45
    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh main before checking freshness
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Check current publication and the two-day reserve
        id: freshness
        run: node scripts/seo-publication-queue.mjs --plan

      - name: Check editorial capacity before generation
        if: steps.freshness.outputs.should_publish == 'true'
        run: node scripts/seo-editorial-health.mjs --require-capacity

      - name: Prepare missing articles with DeepSeek
        id: generation
        if: steps.freshness.outputs.should_publish == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-v4-flash
          ARTICLE_TOPIC: ${{ inputs.topic }}
        run: node scripts/seo-publication-queue.mjs

      - name: Check whether a draft passed the quality gate
        if: steps.generation.outputs.prepared != '' && steps.generation.outputs.prepared != '0'
        id: quality_gate
        run: |
          if git diff --quiet -- app/insights/articles.ts; then
            echo "The generator completed without producing an article." >&2
            exit 1
          fi
          echo "passed=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.quality_gate.outputs.passed == 'true'
        run: npm ci

      - name: Verify production build
        if: steps.quality_gate.outputs.passed == 'true'
        run: npm run build

      - name: Recheck prepared dates before commit
        id: final_freshness
        if: steps.quality_gate.outputs.passed == 'true'
        env:
          PREPARED_DATES: ${{ steps.generation.outputs.prepared_dates }}
        run: |
          set -euo pipefail
          git fetch origin main
          for DATE in ${PREPARED_DATES//,/ }; do
            PUBLISHED="$(git show origin/main:app/insights/articles.ts | node scripts/check-seo-publication.mjs "$DATE" -)"
            if [ "$PUBLISHED" = "true" ]; then
              echo "Another run already prepared $DATE; refusing a duplicate batch." >&2
              exit 1
            fi
          done
          echo "should_commit=true" >> "$GITHUB_OUTPUT"

      - name: Commit article
        if: steps.quality_gate.outputs.passed == 'true' && steps.final_freshness.outputs.should_commit == 'true'
        run: |
          git config user.name "runex-seo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/insights/articles.ts
          if git diff --cached --quiet; then
            echo "The validated draft disappeared before commit." >&2
            exit 1
          fi
          git commit -m "Prepare reviewed logistics insights for scheduled release"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify live publication and deployed reserve
        # Validate the visible article and both hidden future slots, even when
        # no generation was needed. A commit alone is not deployment evidence.
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:app/insights/articles.ts > "$RUNNER_TEMP/published-articles.ts"
          ARTICLES_PATH="$RUNNER_TEMP/published-articles.ts" node scripts/seo-publication-queue.mjs --verify

      - name: Maintain the editorial replenishment alert
        if: always() && !cancelled()
        # An issue API outage must not prevent or undo a valid publication.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:app/insights/articles.ts > "$RUNNER_TEMP/editorial-archive.ts"
          ARTICLES_PATH="$RUNNER_TEMP/editorial-archive.ts" node scripts/seo-editorial-health.mjs --notify
