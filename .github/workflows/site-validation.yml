name: Site and inquiry regression checks

on:
  pull_request:
    paths:
      - "app/**"
      - "lib/**"
      - "worker/**"
      - "db/**"
      - "migrations/**"
      - "public/**"
      - "tests/**"
      - "package*.json"
      - "tsconfig.json"
      - "wrangler.jsonc"
      - ".openai/hosting.json"
      - ".github/workflows/site-validation.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "lib/**"
      - "worker/**"
      - "migrations/**"
      - "wrangler.jsonc"

permissions:
  contents: read

jobs:
  site-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm run install:ci
      - run: npm run typecheck
      - run: npm run lint
      # Contact tests use local SQLite and mock email; no production submissions.
      - run: npm test
